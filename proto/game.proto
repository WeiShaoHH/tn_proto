syntax = "proto3";
import "struct.proto";
option csharp_namespace = "pb";

message GetPreLoginInfoReq {
    string        ClientVersion  = 1;  // 客户端版本
    string        ClientLanguage = 2;  // 语言
    string        OpenID         = 3;  // 开放ID
}

message GetPreLoginInfoRsp{
    RspHead       Head             = 1;
    UserInfo      UserInfo         = 2; // 用户信息
}